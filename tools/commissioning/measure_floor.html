<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地面距離量測</title><style>
body{max-width:1100px;margin:24px auto;padding:12px;background:#121b29;color:#e3efff;font:16px/1.7 system-ui}canvas{width:100%;height:auto;cursor:crosshair;background:#25354a;touch-action:manipulation}input,select,button{font:inherit;padding:6px;margin:5px;background:#22364d;color:white;border:1px solid #69819c}label{display:block}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #425269}#status{color:#aee8d6}a{color:#aee8d6}</style><h1 id="title"></h1>
<p>在地板上點兩個端點，填入現場實際量過的距離。至少加入兩段擬合距離與一段獨立驗證距離，並包含不同方向。端點必須落在地板，不能使用桌面或商品上的距離。</p>
<canvas id="canvas" aria-label="在原圖上點選地面距離端點"></canvas><p id="status">請點選第一個端點。</p><label>實測距離（公尺）<input id="length" type="number" min="0.01" step="0.01" placeholder="例如 0.60"></label><label>用途<select id="purpose"><option value="fit">參與尺度擬合</option><option value="validation">獨立驗證，不參與擬合</option></select></label><button id="add">加入距離</button><button id="clear">重選端點</button><label>現場量測方式<input id="source" size="45" placeholder="例如：捲尺量測三段地磚接縫距離"></label><table><thead><tr><th>編號</th><th>端點（原圖 px）</th><th>公尺</th><th>用途</th><th></th></tr></thead><tbody id="rows"></tbody></table><button id="download">下載 distance-controls.json</button><p>預設地磚規格或假設的設備尺寸不算現場量測。此頁只建立量測檔案，不會更改相機校正。</p><pre id="command"></pre><script>
const META=__META__,$=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),img=new Image();let pending=[],segments=[];
canvas.width=META.image_size_px[0];canvas.height=META.image_size_px[1];$('title').textContent=META.camera_id+'｜地面距離量測';img.onload=draw;img.src='plate.png';
function draw(){ctx.drawImage(img,0,0,canvas.width,canvas.height);[...segments.map(s=>s.points_px),pending].forEach((points,i)=>{ctx.strokeStyle=i===segments.length?'#ffbc59':'#62e6d5';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3;points.forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],5,0,Math.PI*2);ctx.fill()});if(points.length===2){ctx.beginPath();ctx.moveTo(...points[0]);ctx.lineTo(...points[1]);ctx.stroke();ctx.font='18px sans-serif';ctx.fillText(String(i+1),points[0][0]+8,points[0][1]-8)}})}
canvas.onclick=e=>{if(pending.length===2)pending=[];const r=canvas.getBoundingClientRect();pending.push([Math.max(0,Math.min(canvas.width-1,Math.round((e.clientX-r.left)*canvas.width/r.width))),Math.max(0,Math.min(canvas.height-1,Math.round((e.clientY-r.top)*canvas.height/r.height)))]);draw();$('status').textContent=pending.length===2?'已選取兩點，請填寫實測距離。':'請點選第二個端點。'};
function table(){$('rows').replaceChildren();segments.forEach((s,i)=>{const tr=document.createElement('tr');[i+1,JSON.stringify(s.points_px),s.length_m,s.validation?'獨立驗證':'擬合'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.textContent='移除';b.onclick=()=>{segments.splice(i,1);table();draw()};td.append(b);tr.append(td);$('rows').append(tr)})}
$('clear').onclick=()=>{pending=[];draw();$('status').textContent='請重新點選兩個端點。'};
$('add').onclick=()=>{const length=Number($('length').value);if(pending.length!==2||!Number.isFinite(length)||length<=0){$('status').textContent='需要兩個端點與正的實測距離。';return}if(Math.hypot(pending[1][0]-pending[0][0],pending[1][1]-pending[0][1])<8){$('status').textContent='端點太接近，請量較長的一段。';return}segments.push({points_px:pending,length_m:length,validation:$('purpose').value==='validation'});pending=[];table();draw();$('status').textContent='距離已加入。'};
$('download').onclick=()=>{const source=$('source').value.trim();if(!source||segments.filter(s=>!s.validation).length<2||segments.filter(s=>s.validation).length<1){$('status').textContent='請提供量測方式、至少兩段擬合距離與一段獨立驗證距離。';return}const data={...META,measurement_source:source,segments};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=META.camera_id+'.distance-controls.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('command').textContent='.venv/bin/python tools/commissioning/commission_camera.py runs/onboard01/'+META.camera_id+'.calib.json --existing runs/commission01/'+META.camera_id+'.camera.json --distance-controls '+META.camera_id+'.distance-controls.json --out runs/commission_review/'+META.camera_id+'-measured';
</script></html>
