name: CI (promote)

# Tier 2 of the promotion flow feat/* → dev → stage → main. The full gate runs at
# feat→dev (ci.yml); this is a COMBINED-STATE check on BOTH promotion PRs -- dev→stage
# and stage→main.
#
# **`main` was added on 2026-08-30, and until then the last hop had no CI at all.**
# `ci.yml` triggers on `dev`, this triggered on `stage`, and `release.yml` triggers on a
# *push* to `main` -- which is a release, not a gate, and runs after the merge rather than
# before it. So a pull request into `main` ran nothing, on the one hop closest to what
# ships. The reason the omission survived is that it looks like coverage from either end:
# read from `dev` the chain is gated twice, and read from `release.yml` `main` clearly has
# a workflow. Neither view shows the hole.
#
# It exists because GitHub does not re-run a green PR when its base advances: branch
# B can merge into dev having been tested against a dev that never contained branch
# A. The failures that shape lets through are all cross-file, and this repo has a
# particular appetite for them, because several of its invariants are held between
# files that different branches would touch:
#
#   · a config lowers batch_size while another branch edits the base's lr -- the two
#     halves of `lr = batch_size x 1.25e-5` live in different files by design
#   · a taxonomy gains a class in one branch and the palette gains its colour in
#     another, or does not (tests/test_palettes.py)
#   · the indoor-25 baseline's three pinned copies stop agreeing
#     (tests/test_indoor25_baseline.py)
#
# Unlike the sibling Gateway repo, this one re-runs the WHOLE test suite here rather
# than a hand-picked smoke subset. That is following the intent, not departing from
# it: the reason to hand-pick there is that its heavy tiers cost minutes of
# Testcontainers, whereas this suite is ~30 s, so listing a subset would buy nothing
# and would silently stop covering whatever invariant is added next.
#
# The heavy lane -- ONNX export parity, ~2 min across every shipped config -- does
# stay at feat→dev. It is the one check here whose cost is real, and an export is a
# function of one config and the model code, not of how branches combined.
#
# NOTE: this workflow only RUNS the checks. To actually BLOCK a bad promotion, mark
# "CI (promote) / Combined-state smoke" as a required status check in the `stage` AND
# `main` branch protection rules. Ordering matters when you do: a required check that no
# workflow reports leaves every PR "Expected -- waiting for status", permanently
# unmergeable. So this trigger has to reach a branch *before* that branch requires it.
on:
  pull_request:
    branches: [stage, main]
  # And on the push that a promotion actually produces. Two reasons, and the second is
  # the one that is not obvious:
  #
  #   1. A `pull_request` check is the only thing gating `stage`, and it only exists if
  #      somebody opens a PR. A direct push had no check at all.
  #   2. **A `pull_request` run tests a merge that does not exist yet.** GitHub builds a
  #      simulated merge of head into base and runs against that; the commit this repo
  #      actually keeps is a different object, created afterwards. They agree almost
  #      always, which is exactly why the case where they do not would be missed.
  #
  # `main` is deliberately absent here: `release.yml` already runs on that push, and a
  # release-please PR merging into `main` would otherwise pay for this whole suite a
  # second time to re-check a version bump.
  #
  # Cost is one extra run per promotion, not per commit -- pushes to `stage` only happen
  # when a promotion lands.
  push:
    branches: [stage]

# Least-privilege default: jobs only check out code.
permissions:
  contents: read

concurrency:
  group: ci-promote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Combined-state smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The unit tests read git history: `test_deleted_docs_are_cited_as_history`
          # resolves every `git show <sha>:<path>` citation in docs/ with `cat-file -e`,
          # and on the default depth-1 clone not one of those objects exists, so it fails
          # for a reason that has nothing to do with the docs. 24 MiB packed, so a full
          # fetch is cheaper than the failure it removes. Added 2026-08-28, when the real
          # CI logs showed it red on all three matrix rows while every local run was green
          # -- a worktree shares the object database and can never reproduce this.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra export
      # Cheapest first, so the gate fails fast.
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      # Here for the same reason as the test suite: a signature changed on one branch
      # and its caller on another is a cross-file failure that neither branch's own CI
      # run could have seen. Same script and same baseline as ci.yml, so the two tiers
      # cannot disagree about what the number is.
      - name: Type ratchet (src/)
        run: ./scripts/ty_ratchet.sh src/
      - name: Type ratchet (scripts/)
        run: ./scripts/ty_ratchet.sh scripts/
      - name: Type ratchet (tools/)
        run: ./scripts/ty_ratchet.sh tools/
      # Coverage threshold included: a promotion that drops the floor is exactly the
      # kind of thing that only shows up once branches are combined. Same number as
      # ci.yml's, deliberately -- two tiers disagreeing about the floor is how the
      # looser one becomes the real one.
      #
      # 83 -> 85 on 2026-08-30, and 85 is what CI measures, not what a laptop does.
      # Locally this tree reads 86% because `test_run_depth.py` runs there: the model is
      # cached and there is a GPU, so `run_depth` is covered. CI syncs `--extra export`
      # only, that file skips, and every matrix row reports **85.23%**. Setting the floor
      # from the local number would have failed all three rows on the first push.
      - name: Tests on the combined state
        run: uv run pytest --cov --cov-fail-under=85
      # Security moves here too, and for the same combined-state reason as the tests --
      # not as a blanket copy of ci.yml. `pip-audit` reads the *merged* `uv.lock`, and a
      # lock neither branch produced is exactly what two Dependabot PRs make: each was
      # audited against its own base and the combination against neither. bandit rides
      # along because it is seconds and because code that is individually clean on two
      # branches is still only ever scanned separately.
      #
      # ONNX export parity deliberately does NOT move here; see the note above. An export
      # is a function of one config and the model code, not of how branches combined, and
      # it is the one check whose ~2 min is real.
      - name: bandit -- what ships, medium and above
        run: uv run bandit -q -r src -ll
      - name: bandit -- dev-side trees, high only
        run: uv run bandit -q -r scripts tools -lll
      - name: Audit the merged dependency set
        run: uv run pip-audit --progress-spinner off
