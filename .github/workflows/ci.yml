name: CI

on:
  push:
    # dev is where the work happens; gating only main means a broken commit is
    # discovered at merge time, long after it was cheap to fix.
    branches: [main, stage, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra export
      # No dataset needed: the model runs on random tensors, the dataset tests build a
      # fixture in tmp_path, and test_overfit.py memorises one synthetic batch on CPU.
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=68
