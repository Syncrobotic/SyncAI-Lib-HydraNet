name: Release (main)

# Releasing, for the promotion flow feat/* -> dev -> stage -> main. `ci.yml` gates
# feat->dev and `ci-promote.yml` gates dev->stage; this turns an arrival on `main` into a
# tag, a GitHub Release, and the wheel + sdist attached to it, and does nothing elsewhere.
#
# release-please opens a `chore(main): release X.Y.Z` PR against `main` carrying the bump
# and the CHANGELOG entry, and merging it is the act of deciding to release. On that merge
# release-please cuts the tag AND the Release AND flips the release PR's `autorelease`
# label -- the standard flow, so the label bookkeeping cannot fall out of step. The
# `publish` job then builds the distributions and attaches them to the release
# release-please just made.
#
# **Why release-please owns the release now.** It used to be told NOT to
# (`skip-github-release`), because a sibling job cut the tag in order to attach a wheel and
# release-please attaches nothing -- so letting it release would tag with no artifacts. The
# cost of that split was hidden bookkeeping: skipping the release phase also skips the
# label swap, and a merged release PR still wearing `autorelease: pending` makes every
# later run abort ("untagged, merged release PRs outstanding") before proposing the next
# version, while staying green. v0.2.0's PR (#28) froze the pipeline that way for three
# days and v0.3.0's (#36) did it again, because the hand-rolled swap was gated on cutting a
# NEW tag and so could never heal a tag that already existed. The standard flow removes the
# whole class: release-please does the tag, the release, and the label in one place, and
# `publish` uploads the artifacts afterwards.
#
# `release-please-config.json` and `.release-please-manifest.json` are passed to the action
# below, and are also what `tests/test_version_agreement.py` reads to check that
# `CITATION.cff` is listed among their `extra-files` -- the only thing holding the
# citation's version to the package's.
#
# **`main` and `stage` resolve to the same tree and not the same commit, and nothing
# asserts it.** Promotions go through GitHub PRs, and a PR merge writes a merge commit onto
# the target, so `main` carries commits `stage` does not. Those merges carry no content of
# their own, so what is tagged is the tree that was reviewed, reached by a different commit.
#
# Model releases are NOT this. Weights are versioned by `scripts/release_bundle.sh` into an
# immutable checksummed bundle, because `runs/` is not in git and a commit on `main` says
# nothing about which checkpoint a robot is running.
on:
  push:
    branches: [main]
  # Rebuild and re-attach distributions for an existing release -- a transient runner
  # failure, or a tag whose assets never uploaded. Built from that tag's source, so
  # the result is the released version rather than main's HEAD.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build & attach artifacts for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

# Serialize per branch, and never cancel mid-flight: a cancelled release run can
# leave a release without its artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release-please proposes the version on ordinary pushes, and on the push that merges its
  # release PR it cuts the tag, the Release and the label swap, exposing `release_created`
  # and `tag_name` for the publish job to key on.
  #
  # **`target-branch: main`, and the release PR lands on `main` directly.** That is the one
  # thing here that does not ride feat/* -> dev -> stage -> main, and it is deliberate: a
  # version bump and a CHANGELOG entry are metadata *about* a release, not work, and cannot
  # be written before the thing they describe has arrived. `main`'s `__version__` therefore
  # runs ahead of `dev`'s between releases; git keeps `main`'s line on the next promotion
  # since `stage` never touched it.
  #
  # **The base must be a branch with no required status check.** A PR opened with
  # `secrets.GITHUB_TOKEN` does not trigger workflows -- GitHub's recursion guard -- so on a
  # protected base the release PR would be permanently blocked on a check that can never
  # run. `dev` requires `CI success`; `main` requires none, so the release PR merges on
  # inspection, which is what a version bump should be reviewed by anyway.
  release-please:
    name: Release Please (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release PR branch, and create the tag + Release
      pull-requests: write # open the release PR and flip its autorelease label
      issues: write # the autorelease labels ride the issues API
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the wheel + sdist and attach them to the release. Runs on a freshly-cut release
  # (push, `release_created == true`) or a manual rebuild of an existing tag
  # (workflow_dispatch). `always()` lets the dispatch path run even though release-please is
  # skipped on manual runs.
  publish:
    name: Build & attach distributions (main)
    needs: release-please
    if: |
      always()
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the distributions to the release
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
      # The tag to build and attach to: the manual input, else the one just cut.
      TAG: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # The manual value flows into a checkout ref and a `gh release` target, so it is
      # validated before either, and read from the environment rather than inlined.
      - name: Validate tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Invalid tag '$INPUT_TAG' — expected vX.Y.Z (e.g. v0.2.0)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }} # the released tag's source, so a rebuild is byte-for-byte it
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv build

      # Whatever the wheel says is what a `pip install` reports, so a wheel whose version
      # disagrees with the tag it is about to hang on is a release that lies about itself --
      # exactly what a dropped `x-release-please-version` annotation would produce. The old
      # workflow derived the tag from the wheel to avoid this; here the tag comes from
      # release-please, so the same guard is an assertion rather than a derivation.
      - name: Verify the wheel matches the tag
        run: |
          WHEEL=$(ls dist/*.whl)
          VERSION=$(basename "$WHEEL" | cut -d- -f2)
          [ "v${VERSION}" = "$TAG" ] || {
            echo "::error::wheel holds $VERSION but the release tag is $TAG — refusing to attach mismatched artifacts"
            exit 1
          }

      # `--clobber` so a re-run or a manual rebuild overwrites rather than fails; the
      # release itself was created by release-please (push) or already exists (dispatch).
      - name: Attach distributions to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
