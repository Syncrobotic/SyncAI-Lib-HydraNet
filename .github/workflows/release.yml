name: Release (main)

# Releasing, for the promotion flow feat/* -> dev -> stage -> main. `ci.yml` gates
# feat->dev and `ci-promote.yml` gates dev->stage; this turns an arrival on `main` into a
# tag and a GitHub Release, and does nothing anywhere else.
#
# release-please opens a `chore(main): release X.Y.Z` PR against `main` carrying the bump
# and the CHANGELOG entry, and merging it is the act of deciding to release. That arrival
# carries a version with no tag, which is what the `release` job below exists for.
#
# `release-please-config.json` and `.release-please-manifest.json` are passed to the
# action below, and are also what `tests/test_version_agreement.py` reads to check that
# `CITATION.cff` is listed among their `extra-files` -- the only thing holding the
# citation's version to the package's.
#
# **`main` and `stage` resolve to the same tree and not the same commit, and nothing
# asserts it.** Promotions go through GitHub PRs, and a PR merge writes a merge commit
# onto the target, so `main` carries commits `stage` does not. Those merges carry no
# content of their own, so what is tagged is the tree that was reviewed, reached by a
# different commit. Restoring the strict form means promoting by `git merge --ff-only`
# from a clone and re-aligning two shared branches; that has not been done.
#
# Model releases are NOT this. Weights are versioned by `scripts/release_bundle.sh` into
# an immutable checksummed bundle, because `runs/` is not in git and a commit on `main`
# says nothing about which checkpoint a robot is running.
on:
  push:
    branches: [main]
  # Rebuild and re-attach distributions for an existing release -- a transient runner
  # failure, or a tag whose assets never uploaded. Built from that tag's source, so
  # the result is the released version rather than main's HEAD.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build artifacts for, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

# Serialize per branch, and never cancel mid-flight: a cancelled release run can
# leave a tag without its artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release-please proposes the version; the job below turns an arrival carrying an
  # untagged one into a tag and a release. Two jobs because they answer two questions:
  # "what should the next version be" is a function of the commits, and "is this a
  # release" is a function of whether that version already has a tag.
  #
  # **`target-branch: main`, and the release PR lands on `main` directly.** That is the
  # one thing here that does not ride feat/* → dev → stage → main, and it is deliberate:
  # a version bump and a CHANGELOG entry are metadata *about* a release, not work, and
  # they cannot be written before the thing they describe has arrived. `main`'s
  # `__version__` therefore runs ahead of `dev`'s between releases. Nothing conflicts on
  # the next promotion -- git keeps `main`'s line, since `stage` never touched it -- and
  # `test_version_agreement.py` holds `__init__.py` and `CITATION.cff` to each other on
  # whichever branch it runs, both of which release-please updates together.
  #
  # **The base must be a branch with no required status check.** A PR opened with
  # `secrets.GITHUB_TOKEN` does not trigger workflows -- GitHub's recursion guard -- so on
  # a protected base the release PR would be permanently blocked on a check that can never
  # run. `dev` requires `CI success`; `main` requires none, so the release PR merges on
  # inspection, which is what a version bump should be reviewed by anyway.
  release-pr:
    name: Version PR (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release PR's branch
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    name: Tag & publish (main)
    if: |
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag, the release, and upload assets
      pull-requests: write # flip the release PR's autorelease label after tagging
      issues: write # labels ride the issues API, and the label may need creating
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      # The manual value flows into a checkout ref and a `gh release` target, so it
      # is validated before either, and read from the environment rather than
      # inlined into a shell.
      - name: Validate tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Invalid tag '$INPUT_TAG' — expected vX.Y.Z (e.g. v0.2.0)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0 # tags, so an already-released version is recognised
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Build first and take the version from the artifact rather than by parsing
      # `__init__.py`. Whatever the wheel says is what a `pip install` will report,
      # so deriving the tag from it removes the class of bug where the tag and the
      # installed package disagree -- which is exactly what would happen if the
      # `x-release-please-version` annotation were ever dropped from that file.
      - run: uv build

      - name: Resolve version and decide whether this is a release
        id: v
        run: |
          WHEEL=$(ls dist/*.whl)
          VERSION=$(basename "$WHEEL" | cut -d- -f2)
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            # Manual rebuild: the tag exists by definition, and must match the source.
            [ "$INPUT_TAG" = "$TAG" ] || {
              echo "::error::tag $INPUT_TAG holds version $VERSION — refusing to attach mismatched artifacts"
              exit 1
            }
            echo "release=rebuild" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Ordinary promotion of code whose version was released earlier. Not an
            # error and not a release -- most pushes to main are this.
            echo "release=none" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; nothing to release."
          else
            echo "release=new" >> "$GITHUB_OUTPUT"
            echo "$TAG is new; cutting a release."
          fi

      # The notes release-please already wrote, rather than `--generate-notes`:
      # CHANGELOG.md is grouped by the Conventional Commit types this project
      # enforces, and a raw commit list would discard that grouping.
      #
      # **The file is optional and is not in the tree yet**; release-please writes it on
      # the first release PR. Reading it unconditionally raised `FileNotFoundError` before
      # the fallback could run, and the tag and release steps are `if release == 'new'`
      # and sit after this one -- so the version stayed untagged and the next push failed
      # identically. A release that cannot be cut cannot un-break itself.
      - name: Extract the CHANGELOG section
        if: steps.v.outputs.release == 'new'
        run: |
          python3 - "$TAG" <<'PY' > release-notes.md
          import re, sys, pathlib
          tag = sys.argv[1].lstrip("v")
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8") if path.is_file() else ""
          # release-please writes "## [0.2.0](compare-url) (date)"; take that heading
          # to the next one at the same level.
          m = re.search(rf"^##\s+\[?{re.escape(tag)}\]?.*?$(.*?)(?=^##\s|\Z)",
                        text, re.M | re.S)
          print((m.group(1).strip() if m else f"Release {sys.argv[1]}."))
          PY
        env:
          TAG: ${{ steps.v.outputs.tag }}

      - name: Tag and release
        if: steps.v.outputs.release == 'new'
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
        env:
          TAG: ${{ steps.v.outputs.tag }}

      # release-please decides "has this release PR shipped" from the PR's label, not
      # from the tag: its own github-release phase would swap `autorelease: pending`
      # for `autorelease: tagged`, but that phase is skipped here (`skip-github-release`
      # in release-please-config.json, so the tag carries artifacts), and skipping it
      # skips the bookkeeping too. While a merged release PR still wears `pending`,
      # every release-please run aborts with "untagged, merged release PRs outstanding"
      # before proposing the next version -- and the job stays green while doing so.
      # v0.2.0's PR (#28) sat that way from 2026-08-31 to 2026-09-03, and no release PR
      # could open. Since this job is what cuts the tag, it does the swap.
      - name: Mark the release PR tagged
        if: steps.v.outputs.release == 'new'
        run: |
          VERSION="${TAG#v}"
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                --label "autorelease: pending" --json number,title \
                --jq ".[] | select(.title | endswith(\"release ${VERSION}\")) | .number" \
                | head -n1)
          if [ -z "$PR" ]; then
            # A tag can exist without a PR (a bootstrapped first release); not an error.
            echo "No pending release PR carries ${VERSION}; nothing to relabel."
            exit 0
          fi
          # `--force` so an existing label is not a failure; release-please normally
          # creates this one itself, and here it never runs the phase that would.
          gh label create "autorelease: tagged" --repo "$GITHUB_REPOSITORY" \
            --color EDEDED --force \
            --description "release-please: the version this PR carried has been tagged"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label "autorelease: pending" --add-label "autorelease: tagged"
        env:
          TAG: ${{ steps.v.outputs.tag }}

      - name: Re-attach artifacts
        if: steps.v.outputs.release == 'rebuild'
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ steps.v.outputs.tag }}
