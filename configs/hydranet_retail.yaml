# =============================================================================
# SyncAI-Lib-HydraNet: retail deployments (shops, supermarkets, showrooms).
#
# The same network as hydranet_indoor; everything unstated comes from
# _base/hydranet.yaml. What differs, and nothing else:
#   1. data.terrain_classes   the indoor 12 with display_fixture appended as id 12
#   2. label_map              ade20k_retail / retail_native
#   3. COCO sample_ratio      0.1, which was measured rather than chosen -- see below
#   4. terrain head width     13
#
# What this config deliberately does NOT model: "walkable within 5 m" and "the
# merchandise zone on the floor". Both are geometry on the ground plane, both are
# post-processing, and both are argued out in docs/RETAIL.md. Putting a distance
# threshold in a semantic class asks an annotator to distinguish 4.8 m of floor from
# 5.2 m of the same floor.
# =============================================================================
_base_: _base/hydranet.yaml

experiment: hydranet_retail
output_dir: runs/hydranet_retail

model:
  heads:
    traversability:
      # Same reasoning as indoor: a wet floor after a mop and a glass storefront are
      # both small in pixels and both the ways a shop robot fails.
      loss: { ce_weight: 1.0, dice_weight: 1.5, ignore_index: 255 }
    terrain:
      num_classes: 13             # indoor 12 + display_fixture
      loss: { ce_weight: 1.0, dice_weight: 1.0, ignore_index: 255 }
    detection:
      # Train on all 80: COCO supervision is free signal for the shared trunk, and
      # dropping classes at training time does not speed up the robot. Narrow at export
      # instead -- on an AGX Orin the measured post-processing was 43% of the frame,
      # nearly all of it the sigmoid over 80 classes at 6,825 positions. About eight
      # classes change a shop robot's behaviour (person, chair, backpack, handbag,
      # suitcase, bottle, cup, potted plant); the rest are traffic.
      num_classes: 80

data:
  letterbox: true

  # Order defines the class id; matches label_maps_retail.RETAIL_TERRAIN.
  # 0-11 are byte-identical to the indoor scheme on purpose -- see the module docstring.
  terrain_classes: [void, floor_hard, floor_soft, floor_metal, wet_slippery,
                    stairs, threshold_ramp, wall, glass, door,
                    obstacle_furniture, person, display_fixture]

  datasets:
    # Bootstrap only. ADE20K's indoor images are homes and restaurants, so it teaches
    # the shape of a waist-height surface holding objects, not a shop. It cannot teach
    # a gondola aisle, a storefront reflection, or the robot's own viewpoint -- the
    # indoor runs measured a ceiling coming back 25% "go" for exactly that reason.
    - name: ade20k
      type: seg_folder
      root: datasets/ADE20K
      split_train: train
      split_val: val
      split_test: test
      label_map: ade20k_retail
      supervises: [traversability, terrain]
      sample_ratio: 1.0

    # Store footage. This is the dataset that decides whether the model works, and it
    # is the only source of display_fixture that means anything. Capture at the robot's
    # camera height and pitch, one directory per session, and split by store -- never
    # by frame, and preferably not even by session within one store: aisles repeat, and
    # a val score taken inside the same shop measures memorisation of that shop.
    # - name: store_site
    #   type: seg_folder
    #   root: datasets/retail
    #   split_train: train
    #   split_val: val
    #   label_map: retail_native   # annotation ids are already the retail 13
    #   supervises: [traversability, terrain]
    #   sample_ratio: 3.0          # oversample: fewer images, far more relevant

    - name: coco
      type: coco
      root: datasets/coco
      split_train: train2017
      split_val: val2017
      supervises: [detection]
      # Do not raise this. Swept on the indoor model at 60 epochs and scored on the
      # held-out test split (329 images, never used to select a checkpoint):
      #
      #   ratio            0        0.1       0.3       1.0
      #   detection mAP    --     0.1988    0.2790    0.3348
      #   terrain mIoU   0.5718   0.5968    0.5025    0.3591
      #   glass IoU      0.5021   0.5462    0.4438    0.0692
      #   caution IoU    0.3252   0.3346    0.2649    0.1064
      #
      # Every segmentation metric falls monotonically after 0.1 -- there is no ratio that
      # buys detection without paying in segmentation. Worse, the exchange rate gets
      # worse as you climb: 0.1->0.3 costs 0.102 of glass for 0.080 of mAP, and
      # 0.3->1.0 costs 0.375 for 0.056.
      #
      # Glass is the first class to collapse and a shop is made of it -- storefronts,
      # display cases, mirrored columns. Buying mAP with glass is the worst trade
      # available in this deployment.
      #
      # If detection has to be better than mAP 0.20, buy it with detection data or a
      # wider detection head, not by starving the segmentation heads. Note also that at
      # ratio 0.3 the best checkpoint was the last one -- detection had not converged, so
      # 0.279 understates it, while the segmentation cost was already fully paid.
      sample_ratio: 0.1

  # Measured by `scripts/bench_batch_size.py` (deleted in `500cdd2`, which is why the
  # table is here rather than behind it) on an RTX PRO 6000 (24 cores), loader alone,
  # batch 32:
  #
  #     workers    4      8     12     16
  #     img/s  172.4  361.3  322.6  312.2
  #
  # Raised to 8 for headroom at larger batches, NOT because 4 was starving this run.
  # That was tried and measured: resuming the batch-8 baseline with 8 workers changed
  # throughput not at all (132-136 img/s before, 132-136 after). The reason is simply
  # that supply at 4 workers (172) already exceeded what a batch-8 step consumes (132) --
  # the loader was never the constraint at this batch size, and reading it as one meant
  # comparing supply against the batch-*32* compute ceiling by mistake.
  #
  # It becomes the constraint at batch 32, where compute wants 434 and even 8 workers
  # supply only 361. That is what this setting is for.
  #
  # Past 8 it regresses: the loader is per-dataset, so `workers: 12` with two datasets
  # is 24 worker processes plus the trainer on 24 cores.
  workers: 8

train:
  # Same inherited-lr bug as hydranet_indoor.yaml: the base's 2.0e-4 is set for its
  # batch of 16, so a batch of 8 has to bring its own lr down with it.
  #
  # **Left at 8 deliberately, and it is not the fast setting.** Measured on an RTX PRO
  # 6000, model only, 512x640 bf16, quiet card:
  #
  #     batch     8     16     32     48
  #     NHWC  233.5  399.3  433.9  433.0   img/s
  #     peak    1.9    3.8    7.4   11.0   GiB
  #
  # Compute plateaus at 32; 48 buys nothing and costs 3.6 GiB. So the throughput setting
  # on this hardware is batch 32 with lr 4.0e-4 -- which is this project's own scaling
  # rule, lr = batch_size x 1.25e-5, and not a guess.
  #
  # What keeps 8 here is that every number in docs/RETAIL.md was measured at this
  # batch. Changing it silently redefines the baseline those tables compare against, and
  # a faster baseline that is no longer comparable to the conclusions already drawn from
  # it is a bad trade. Override per run instead, when the comparison does not matter:
  #
  #     hydranet-train --config configs/hydranet_retail.yaml \
  #         --set train.batch_size=32 train.lr=4.0e-4 train.channels_last=true
  #
  # (`workers` and `channels_last` are safe to change here because neither alters what
  # the optimiser sees -- only how fast it gets there.)
  batch_size: 8
  lr: 1.0e-4

  # +26% from batch 16 up on this card (399.3 vs 318.1 at 16, 433.9 vs 345.5 at 32),
  # and only +3.5% at batch 8 -- NHWC needs a batch to pay off. Note this contradicts
  # the -33% that scripts/bench_channels_last.py recorded on older hardware (the script
  # went in `500cdd2`; the figure is the whole of what it said): the flag is
  # architecture-dependent, so re-measure it per box rather than inheriting the verdict.
  channels_last: true

  # A shop robot's expensive mistakes are: walking into a glass storefront, walking
  # into a display, and slipping on a mopped floor. Two of those are `blocked`, so the
  # balanced default is a reasonable start -- but once store data exists, selecting on
  # the class that actually strands the robot is more honest, e.g.
  #   primary_metric: IoU/terrain/12_display_fixture
  #   primary_metric: IoU/terrain/08_glass
  primary_metric: traversability_mIoU
