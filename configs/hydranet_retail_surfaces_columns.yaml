# =============================================================================
# `hydranet_retail_surfaces` plus 168 pre-labelled site frames aimed at one class.
#
# THE QUESTION
#
# `column` scores 0.39-0.47 on val and predicts **0.00% of pixels** on four real store
# cameras; Taichung-cam11's clad free-standing pillar, dead centre of frame, comes back
# `wall`. The cause was written down before the run started -- `column` is sourced from
# ADE20K id 43, atrium and lobby columns, not a shop's -- and its support in the training
# data is **1.16% of labelled pixels**.
#
# `datasets/retail_objects_columns_clean` is 108 frames from the nine site cameras where
# SAM 3 returns a column at score >= 0.5 **and which are in neither the val nor the test
# split**, and `column` is **20.38% of its labelled pixels, on 105 of its 108 images**. That is a factor of fifteen more support, in the domain the
# class is failing in.
#
# WHAT THIS RUN CAN AND CANNOT SETTLE
#
# It can settle whether an *externally* labelled batch moves the class. RETAIL.md
# measured the self-training version of this question and got **-0.0096** on
# `display_fixture`: labels drawn from the model can only harden what it already believes.
# SAM 3 has never seen this model's mistakes, so the sign is genuinely unknown, and
# looking at the masks harder cannot answer it. Only a run can.
#
# It cannot settle whether the class is *right*. `datasets/retail_objects_batch02`, which
# supplies val, is itself SAM 3 output at upscale 3.0 with no human pass (see its
# `sam3_batch.json`). A `column` IoU gain on that val is partly agreement between two
# batches from the same labeller. **The non-circular read is the prediction rate on the
# cameras this batch does not contain** -- RAM++ independently tags `pillar` on 21 of 48
# cameras and only 14 are here, so the other 7 are a held-out check that owes nothing to
# SAM 3.
#
# THE BATCH IS UNREVIEWED, AND THAT LOOKS FINE
#
# An earlier version of this comment said "roughly half of it is right" and named
# Kaohsiung-cam12 as wall piers, Tao-Hsin-cam04 as a frame-edge strip and Taichung-cam05
# as a wall section. **That judgement was made from 640x360 thumbnails in a contact sheet
# and it was wrong.** Re-checked at native 1920x1080: cam12 is an unmistakable
# free-standing square column with both faces and its corner edge visible, standing on the
# floor in front of the staircase; Tao-Hsin-cam04's is a floor-to-ceiling column in the
# left aisle with a display counter passing behind it, nowhere near the frame edge;
# cam05's is a clean vertical column mid-floor. The masks follow the silhouettes.
#
# The same comment cited the 0.26-0.37 drift onto adjacent shopfront strips as a residual
# defect. It is not: that was measured during the threshold sweep at 0.25, and this batch
# is produced at `min_score` 0.5, which is what the sweep raised it to.
#
# The lesson worth keeping is about the reviewing, not the labels: a downscaled tile is
# enough to see *that* a prompt fired and not enough to see *what* it fired on, and the
# two get confused because a contact sheet feels like looking.
#
# THE LEAK THIS CONFIG WAS FIRST WRITTEN WITH, AND WHY THE BATCH IS NOW `_clean`
#
# `retail_objects_batch02` splits **by camera**: val is Kaohsiung-cam06, Taichung-cam01
# and Tao-Hsin-cam15; test is six more. The first version of this config pointed at
# `datasets/retail_objects_columns`, which was built from the 14 cameras where SAM 3
# returns a column at >= 0.5 -- chosen with no regard to that split. Two of the three val
# cameras and three of the six test cameras were therefore trained on.
#
# So the `column`/site_seg 0.34 -> 0.84 that first run produced is contamination, not a
# result: the model had seen two thirds of the cameras it was scored on. The test split
# is the more expensive half of the damage -- `RETAIL_DATA.md` exists because a
# rare class has to be measured somewhere nothing in training has read.
#
# `datasets/retail_objects_columns_clean` is the nine cameras that appear in neither val
# nor test: Kaohsiung-cam01/02/04/08, Taichung-cam04/05/10/11, Tao-Hsin-cam04. 108
# frames, `column` 20.38% of labelled pixels on 105 of them.
#
# The general rule, since it cost a full three-seed run: a supplementary dataset built by
# selecting cameras on a *property* -- "SAM 3 finds a column here" -- selects against
# whatever split those cameras already belong to, and nothing in the config system
# notices, because the two datasets are separate entries with separate roots.
#
# WHY IT DECLARES NO `split_val`
#
# A split that selects the answer cannot also measure it. This batch trains and takes no
# part in checkpoint selection or in any reported metric, so `hydranet_retail_surfaces`
# and this config are scored on exactly the same val set and the difference is the data.
#
# The batch carries **no `floor` and no `wall`** -- both are `default_on=False` in the
# object prompt table, so 57.56% of its pixels are 255 and neither class takes a gradient
# from it. That is the intended shape: it is a column supplement, not a second site set.
# =============================================================================

_base_: hydranet_retail_surfaces.yaml

experiment: hydranet_retail_surfaces_columns
output_dir: runs/hydranet_retail_surfaces_columns

data:
  datasets:
    - name: ade20k
      type: seg_folder
      root: datasets/ADE20K
      split_train: train
      split_val: val
      split_test: test
      label_map: ade20k_retail_surfaces
      sample_ratio: 0.15
      supervises: [terrain]

    - name: site_seg
      type: seg_folder
      root: datasets/retail_objects_batch02
      split_train: train
      split_val: val
      split_test: test
      label_map: retail_surfaces_from_objects
      sample_ratio: 3.0
      supervises: [terrain]

    # The new arm. Same label map as `site_seg` -- the batch was written under the object
    # taxonomy, so it renumbers into the surfaces six the same way, `product` folding into
    # `fixture`. sample_ratio matches `site_seg` so the two site sources carry equal
    # weight: 168 images -> 5 batches x 3.0 = 15 seg steps per epoch, the same as
    # batch02's 180 images. The store's share of segmentation steps goes from roughly
    # half to roughly two thirds, which is the direction
    # `minority_sourced_terrain_classes` argues for and the reason ade20k sits at 0.15.
    - name: site_columns
      type: seg_folder
      root: datasets/retail_objects_columns_clean
      split_train: train
      label_map: retail_surfaces_from_objects
      sample_ratio: 3.0
      supervises: [terrain]

    - name: site_boxes
      type: coco
      root: datasets/retail_objects_batch02
      split_train: train
      split_val: val
      split_test: test
      sample_ratio: 1.0
      supervises: [detection]
