# walk01 smoke -- hydranet_retail_walk01.yaml's model on the datasets this box has, one
# epoch, a few hundred images: its job is to show that pose02's weights load under the
# four-head config, that all four heads train and validate together, and that the
# export carries the new output. Its numbers mean nothing beyond "not broken".
#
#   hydranet-train --config configs/hydranet_retail_walk01_smoke.yaml \
#       --load runs/hydranet_retail_pose02/best.pt
#
# Missing against the real config: site_seg / site_seg03 (terrain + walkable on site
# frames), site_boxes / site_boxes03 and site_pose. Here terrain sees only ADE20K, and
# detection and pose see only COCO.
seed: 42

model:
  backbone:
    name: regnet_x_800mf
    pretrained: true
    frozen_stages: 0
  neck:
    name: bifpn
    out_channels: 96
    num_repeats: 2
    num_levels: 5
  heads:
    traversability:
      type: semantic_fpn
      num_classes: 2
      in_levels: [0, 1, 2]
      channels: 64
      dropout: 0.1
      loss:
        ce_weight: 1.0
        dice_weight: 1.5
        ignore_index: 255
    terrain:
      type: semantic_fpn
      num_classes: 6
      in_levels: [0, 1, 2]
      channels: 64
      dropout: 0.1
      loss:
        ce_weight: 1.0
        dice_weight: 1.5
        ignore_index: 255
        class_weights: [0.0, 0.54, 0.66, 1.6, 0.46, 1.73]
    detection:
      type: fcos
      num_classes: 4
      in_levels: [0, 1, 2, 3, 4]
      channels: 96
      num_convs: 4
      strides: [8, 16, 32, 64, 128]
      loss:
        cls_weight: 1.0
        reg_weight: 1.0
        centerness_weight: 1.0
      classes: [person, bag, boxed_stock, device]
    pose:
      type: pose_p3
      num_classes: 17
      channels: 96
      num_convs: 3
      sigma_cells: 1.5
      teacher_min_conf: 0.3
  loss_balancing: uncertainty
  fixed_weights:
    traversability: 1.0
    terrain: 1.0
    detection: 1.0
    pose: 1.0

data:
  input_size: [640, 1120]
  workers: 8
  augment:
    scale_range: [0.75, 1.5]
    flip_p: 0.5
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
  letterbox: true
  terrain_classes: [void, floor, wall, column, fixture, person]
  datasets:
    - name: ade20k
      type: seg_folder
      root: datasets/ADE20K
      split_train: train
      split_val: val
      label_map: ade20k_retail_surfaces_walk
      sample_ratio: 0.02
      supervises: [terrain, traversability]
    - name: retail_v3
      type: seg_folder
      root: datasets/retail_v3_512
      # Train only. Its val split shares 19 cameras with its train split (it was cut by
      # frame, not by camera), and main 0.5.0's trainer refuses that as a leak. A
      # camera-disjoint 512 build from datasets/retail_v3/_camera_split.json would give
      # this head a site val again; until then its val number comes from ADE20K.
      split_train: train
      label_map: retail_v3_native_walk
      sample_ratio: 0.05
      supervises: [traversability]
    - name: coco_person
      type: coco
      root: datasets/coco
      split_train: train2017
      split_val: val2017
      classes: [person, backpack, handbag, suitcase]
      det_vocab: retail_security
      sample_ratio: 0.002
      supervises: [detection]
    - name: coco_pose
      type: pose_keypoints
      root: datasets/coco_pose
      split_train: train2017
      split_val: val2017
      sample_ratio: 0.005
      supervises: [pose]

train:
  epochs: 1
  batch_size: 16
  optimizer: adamw
  lr: 0.0002
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  warmup_iters: 10
  scheduler: cosine
  amp: true
  amp_dtype: bfloat16
  grad_clip: 10.0
  ema: true
  ema_decay: 0.9998
  log_interval: 10
  val_interval: 1
  primary_metric: traversability_mIoU
  pose_val_max_persons: 500
  channels_last: true
  early_stop_patience: 0
  detection_val_interval: 1

export:
  opset: 17

experiment: hydranet_retail_walk01_smoke
output_dir: runs/hydranet_retail_walk01_smoke
