# =============================================================================
# SyncAI-Lib-HydraNet: indoor deployments (lobbies, corridors, factory floors).
#
# Everything not stated here comes from _base/hydranet.yaml. What differs from the
# off-road config is only:
#   1. data.terrain_classes  the indoor 12 classes, see data/label_maps_indoor.py
#   2. data.datasets         ADE20K replaces RUGD/RELLIS; COCO is unchanged
#   3. data.letterbox: true  site cameras rarely match the input aspect ratio
#   4. a higher dice_weight, for the rare dangerous classes
# The model, losses and training mechanics are identical: the shared-trunk design is
# independent of the environment.
# =============================================================================
_base_: _base/hydranet.yaml

experiment: hydranet_indoor
output_dir: runs/hydranet_indoor

model:
  heads:
    traversability:
      # Indoor safety-critical classes (glass, stairs, wet floor) cover a tiny pixel
      # fraction, so Dice gets more weight here than in the off-road config.
      loss: { ce_weight: 1.0, dice_weight: 1.5, ignore_index: 255 }
    terrain:
      loss: { ce_weight: 1.0, dice_weight: 1.0, ignore_index: 255 }

data:
  letterbox: true                 # preserve aspect ratio; padding is labelled ignore

  # Order defines the class id; matches label_maps_indoor.INDOOR_TERRAIN
  terrain_classes: [void, floor_hard, floor_soft, floor_metal, wet_slippery,
                    stairs, threshold_ramp, wall, glass, door,
                    obstacle_furniture, person]

  datasets:
    # ADE20K SceneParsing: ~1 GB, 20k images, indoor-heavy. Expected layout:
    #   datasets/ADE20K/images/{train,val}/**.jpg
    #   datasets/ADE20K/annotations/{train,val}/**.png    (single channel, 0..150)
    # Filter to indoor scenes with the official sceneCategories.txt before importing.
    - name: ade20k
      type: seg_folder
      root: datasets/ADE20K
      split_train: train
      split_val: val
      # best.pt is selected on val, which makes val an optimistic estimate of itself.
      # test is written by `hydranet-prepare-ade20k --test-fraction 0.5` and nothing in
      # training ever reads it. Report final numbers with:
      #   hydranet-eval --config ... --checkpoint ... --split test
      # Note this is same-distribution held-out data, not a field test: ADE20K is web
      # photography, so it bounds generalisation to ADE20K, not to our sites.
      split_test: test
      label_map: ade20k_indoor
      supervises: [traversability, terrain]
      sample_ratio: 1.0

    # Your own site annotations. This is what actually decides field performance:
    # ADE20K covers none of metal grating, wet floor, door sills, or the specular
    # reflections on polished floors that make a ceiling look like an open corridor.
    # - name: syncrobotic_site
    #   type: seg_folder
    #   root: datasets/site
    #   split_train: train
    #   split_val: val
    #   label_map: indoor_native   # annotation ids are already the indoor 12 classes
    #   supervises: [traversability, terrain]
    #   sample_ratio: 3.0          # oversample: fewer images but far more relevant

    - name: coco
      type: coco
      root: datasets/coco
      split_train: train2017
      split_val: val2017
      supervises: [detection]
      sample_ratio: 0.2           # for laptop runs; raise to 1.0 on CUDA

  workers: 4                      # one loader per dataset, so keep this modest

train:
  batch_size: 8
