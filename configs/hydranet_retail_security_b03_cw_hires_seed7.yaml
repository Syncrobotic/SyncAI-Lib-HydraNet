# Seed replicate of hydranet_retail_security_b03_cw_hires.yaml -- read that file for why
# 512x896 is expected to help `fixture`/`wall` and not `column`.
#
# It inherits `b03_cw` directly and restates both `seed` and `input_size`, because
# inheriting either sibling reaches nine levels and `_MAX_BASE_DEPTH` is 8. The limit is
# right; eight configs deep to express one run is the smell, and flattening this family is
# worth doing once the comparison is finished rather than in the middle of it.
_base_: hydranet_retail_security_b03_cw.yaml

experiment: hydranet_retail_security_b03_cw_hires_seed7
output_dir: runs/hydranet_retail_security_b03_cw_hires_seed7
seed: 7

data:
  input_size: [512, 896]
