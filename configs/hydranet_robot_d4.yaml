# =============================================================================
# The robot's model, plus a fourth head. Everything else is byte-identical to
# runs/hydranet_joint_coco10/config.yaml -- the config behind the RKNN the Lite3 runs
# today -- so any difference in the three existing heads is attributable to the depth
# head being added, and to nothing else. That includes keeping `primary_metric:
# detection_mAP`, which is not the metric a walking robot cares most about: changing
# selection *and* adding a head at once would make the result unattributable.
#
# WHY A FOURTH HEAD RATHER THAN A NEW MODEL
#
# The deployed model is traversability + terrain + detection. The depth runs done today
# are single-head, so deploying either would have replaced all three with one -- a
# regression, not an upgrade. HydraNet's partial supervision makes addition the honest
# option instead: ade20k batches contribute only the two segmentation losses, coco
# batches only detection, NYUv2 batches only depth, and the shared trunk learns from all
# three. `compute_losses` skips heads a batch does not supervise, so nothing is trained
# on absent labels.
#
# WHAT THIS DEPTH HEAD IS NOT
#
# **It has never seen the robot's domain.** NYUv2 is a Kinect at head height in furnished
# rooms; the Lite3's lens sits ~25 cm off the floor. Measured today, that kind of domain
# change cost a published metric-depth model a flat 15% of scale, so this head will emit
# confident metres that are wrong by an unknown factor on the robot. It is here to be
# *carried*, exported and measured -- not trusted -- until E-prep supplies a scale anchor
# from the robot's own camera. `docs/RESEARCH_OCCUPANCY.md` has the state of that.
#
# Known inconsistency, stated rather than hidden: ade20k and coco are letterboxed to
# 512x640 while the NYUv2 loader stretches 480x640 to fit. A 6.7% vertical stretch
# changes the geometry a metric depth head is learning. It is small, it is real, and it
# is the first thing to fix if the depth numbers look off in a way scale cannot explain.
# =============================================================================

experiment: hydranet_robot_d4
output_dir: runs/hydranet_robot_d4
seed: 42
model:
  backbone:
    name: regnet_x_800mf
    pretrained: true
    frozen_stages: 0
  neck:
    name: bifpn
    out_channels: 96
    num_repeats: 2
    num_levels: 5
  heads:
    traversability:
      type: semantic_fpn
      num_classes: 3
      in_levels:
      - 0
      - 1
      - 2
      channels: 64
      dropout: 0.1
      loss:
        ce_weight: 1.0
        dice_weight: 1.5
        ignore_index: 255
    terrain:
      type: semantic_fpn
      num_classes: 12
      in_levels:
      - 0
      - 1
      - 2
      channels: 64
      dropout: 0.1
      loss:
        ce_weight: 1.0
        dice_weight: 1.0
        ignore_index: 255
    detection:
      type: fcos
      num_classes: 80
      in_levels:
      - 0
      - 1
      - 2
      - 3
      - 4
      channels: 96
      num_convs: 4
      strides:
      - 8
      - 16
      - 32
      - 64
      - 128
      loss:
        cls_weight: 1.0
        reg_weight: 1.0
        centerness_weight: 1.0
    depth:
      type: depth_fpn
      in_levels:
      - 0
      - 1
      - 2
      channels: 64
      dropout: 0.1
      max_depth: 10.0
      loss:
        lam: 0.85
        alpha: 10.0
  loss_balancing: uncertainty
  fixed_weights:
    traversability: 1.0
    terrain: 1.0
    detection: 1.0
data:
  input_size:
  - 512
  - 640
  letterbox: true
  terrain_classes:
  - void
  - floor_hard
  - floor_soft
  - floor_metal
  - wet_slippery
  - stairs
  - threshold_ramp
  - wall
  - glass
  - door
  - obstacle_furniture
  - person
  datasets:
  - name: ade20k
    type: seg_folder
    root: datasets/ADE20K
    split_train: train
    split_val: val
    split_test: test
    label_map: ade20k_indoor
    supervises:
    - traversability
    - terrain
    sample_ratio: 1.0
  - name: coco
    type: coco
    root: datasets/coco
    split_train: train2017
    split_val: val2017
    supervises:
    - detection
    sample_ratio: 1.0
  - name: nyuv2
    type: nyu_depth
    root: datasets/nyu_depth_v2/extracted
    split_train: train
    split_val: val
    supervises:
    - depth
    head_name: depth
    max_depth: 10.0
    sample_ratio: 0.5
  workers: 8
train:
  epochs: 60
  batch_size: 48
  optimizer: adamw
  lr: 0.0006
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  warmup_iters: 2000
  scheduler: cosine
  amp: true
  grad_clip: 10.0
  ema: true
  ema_decay: 0.9998
  log_interval: 50
  val_interval: 1
  primary_metric: detection_mAP
  amp_dtype: bfloat16
  tf32: true
  cudnn_benchmark: true
export:
  opset: 17
  input_size:
  - 512
  - 640
