# =============================================================================
# What every HydraNet config shares. Inherit it with `_base_: _base/hydranet.yaml`
# and override only what makes your run different -- that difference is the thing a
# reader is looking for, and it is invisible in a file that repeats 90 lines first.
#
# There is nothing environment-specific here on purpose: no dataset, no class list, no
# experiment name. Those are exactly the keys a config must state for itself, and this
# file omitting them means a config that forgets one fails validation instead of
# quietly inheriting somebody else's.
#
# Merge rules: dicts merge key by key, everything else replaces. A child's
# `data.datasets` therefore replaces the list rather than appending to it.
# =============================================================================

seed: 42

model:
  backbone:
    name: regnet_x_800mf          # alternatives: regnet_x_1_6gf / resnet18 / resnet34
    pretrained: true              # ImageNet weights; essential at this dataset size
    frozen_stages: 0              # >0 freezes early stages for small-data transfer
  neck:
    name: bifpn                   # bifpn | fpn
    out_channels: 96
    num_repeats: 2
    num_levels: 5                 # P3..P7 for detection; segmentation uses P3..P5
  heads:
    traversability:               # head 1: per-pixel "can the robot step here"
      type: semantic_fpn
      num_classes: 3              # 0=blocked 1=caution 2=go
      in_levels: [0, 1, 2]        # P3, P4, P5
      channels: 64
      dropout: 0.1
      loss: { ce_weight: 1.0, dice_weight: 1.0, ignore_index: 255 }
    terrain:                      # head 2: per-pixel surface material
      type: semantic_fpn
      num_classes: 12             # override alongside data.terrain_classes
      in_levels: [0, 1, 2]
      channels: 64
      dropout: 0.1
      loss: { ce_weight: 1.0, dice_weight: 0.5, ignore_index: 255 }
    detection:                    # head 3: FCOS, anchor-free
      type: fcos
      num_classes: 80             # COCO. Train on all 80, narrow at export.
      in_levels: [0, 1, 2, 3, 4]  # P3..P7
      channels: 96
      num_convs: 4
      strides: [8, 16, 32, 64, 128]
      loss: { cls_weight: 1.0, reg_weight: 1.0, centerness_weight: 1.0 }
  # Kendall et al. 2018 learned uncertainty weighting balances the three losses.
  loss_balancing: uncertainty     # uncertainty | fixed
  fixed_weights: { traversability: 1.0, terrain: 1.0, detection: 1.0 }

data:
  input_size: [512, 640]          # H, W. Start at 384x512 on Jetson.
  workers: 8                      # one loader per dataset; lower this on a laptop
  # Augmentation strength is part of what produced a checkpoint, so it is stated rather
  # than hidden in transforms.py. These are the values every run before it became
  # configurable used, which is what keeps those runs comparable to new ones.
  augment:
    scale_range: [0.75, 1.5]
    flip_p: 0.5
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3

train:
  epochs: 60
  batch_size: 16                  # each step draws one batch from a single dataset
  optimizer: adamw
  # Every run this project has produced sits on lr = batch_size x 1.25e-5, and this
  # pair is on that line. A config that changes batch_size has to move lr with it;
  # tests/test_config_defaults.py checks that the shipped ones still do.
  lr: 2.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  warmup_iters: 1000
  scheduler: cosine
  amp: true                       # automatically disabled off CUDA
  # Stated rather than left to the code default, which said float16. All nine runs in
  # runs/ were trained in bfloat16 and every one of them supplied it on the command
  # line, so the value a plain `hydranet-train --config` used was one nothing had ever
  # been trained with -- on a detection loss with its own history of AMP dtype bugs.
  # Needs Ampere or newer; on older cards the trainer says so instead of downgrading.
  amp_dtype: bfloat16
  grad_clip: 10.0
  ema: true                       # decay ramps up over train.ema_warmup_steps, so
                                  # short runs are safe too; see docs/TRAIN_MACOS.md
  ema_decay: 0.9998
  log_interval: 50
  val_interval: 1

  # The single number that decides best.pt; any key validation emits works, e.g.
  # IoU/traversability/00_blocked or IoU/terrain/08_glass. Averaging mIoU with mAP
  # is not a quantity: the two do not share a scale.
  primary_metric: traversability_mIoU

export:
  opset: 17
  input_size: [512, 640]
