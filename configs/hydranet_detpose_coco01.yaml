# ---------------------------------------------------------------------------
# detection + pose on COCO only.
#
# terrain is left out: its 22-class taxonomy has five annotated frames, and
# multitask.py rightly refuses a declared head that nothing supervises.
#
# The site datasets pose02 trained on -- retail_objects_batch02/03 and
# site30k_v1 -- are NOT on this machine; nothing under /data matches those
# names. So this cannot reproduce pose02's 0.211 mAP / 0.935 PCK, and its
# numbers are not comparable to them: different data, public rather than
# in-house, and without `boxed_stock`, which exists only in the missing sets.
#
# datasets/coco_pose is a symlink shim, not a copy: COCO's
# person_keypoints_*.json is already the format PoseKeypointsDataset reads, and
# the loader wants <root>/annotations/keypoints_<split>.json plus a flat
# <root>/images/. 123,287 symlinks, 12 MB.
#
# primary_metric is detection_mAP: detection is the weaker head (0.211 against
# pose's 0.935) and pose02 already showed what selecting on the strong head
# costs the other -- 6 mIoU points of terrain, per selection.json.
#
# detection_val_interval is 1, not 3. The schema catches the alternative: with
# val_interval 3 and detection_val_interval 3 the detection val set is dropped on
# two epochs in three, so `detection_mAP` -- the selection metric -- is simply
# absent and the run dies at the end of epoch 1.
#
# sample_ratio 0.15 on both, so an epoch is ~18k detection and ~18k pose images
# rather than 118k of each; 60 epochs of that is a real run, not a smoke test.
# ---------------------------------------------------------------------------
seed: 42
model:
  backbone:
    name: regnet_x_800mf
    pretrained: true
    frozen_stages: 0
  neck:
    name: bifpn
    out_channels: 96
    num_repeats: 2
    num_levels: 5
  heads:
    detection:
      type: fcos
      num_classes: 4
      in_levels:
      - 0
      - 1
      - 2
      - 3
      - 4
      channels: 96
      num_convs: 4
      strides:
      - 8
      - 16
      - 32
      - 64
      - 128
      loss:
        cls_weight: 1.0
        reg_weight: 1.0
        centerness_weight: 1.0
      classes:
      - person
      - bag
      - boxed_stock
      - device
    pose:
      type: pose_p3
      num_classes: 17
      channels: 96
      num_convs: 3
      sigma_cells: 1.5
      teacher_min_conf: 0.3
  loss_balancing: uncertainty
  fixed_weights:
    traversability: 1.0
    terrain: 1.0
    detection: 1.0
    pose: 1.0
data:
  input_size:
  - 640
  - 1120
  workers: 8
  augment:
    scale_range:
    - 0.75
    - 1.5
    flip_p: 0.5
    brightness: 0.3
    contrast: 0.3
    saturation: 0.3
  letterbox: true
  datasets:
  - name: coco_det
    type: coco
    root: datasets/coco
    split_train: train2017
    split_val: val2017
    classes:
    - person
    - backpack
    - handbag
    - suitcase
    det_vocab: retail_security
    sample_ratio: 0.15
    supervises:
    - detection
  - name: coco_pose
    type: pose_keypoints
    root: datasets/coco_pose
    split_train: train2017
    split_val: val2017
    sample_ratio: 0.15
    supervises:
    - pose
train:
  epochs: 60
  batch_size: 32
  optimizer: adamw
  lr: 0.0004
  backbone_lr_mult: 0.1
  weight_decay: 0.05
  warmup_iters: 1000
  scheduler: cosine
  amp: true
  amp_dtype: bfloat16
  grad_clip: 10.0
  ema: true
  ema_decay: 0.9998
  log_interval: 50
  val_interval: 3
  primary_metric: detection_mAP
  pose_val_max_persons: 4000
  channels_last: true
  early_stop_patience: 0
  detection_val_interval: 1
export:
  opset: 17
experiment: detpose_coco01
output_dir: runs/detpose_coco01
