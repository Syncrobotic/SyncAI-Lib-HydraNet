repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Compose's !override tag is not plain YAML, and it is the only way to replace
        # a list from upstream's file rather than append to it. `docker compose config`
        # validates that file properly.
        exclude: ^tools/annotation/docker-compose\.override\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]   # datasets and checkpoints stay out of git entirely
        # README figures are animations and do not fit in 1 MB at a size worth looking
        # at; assets/retail_cctv_3heads.gif is 3.9 MB. Narrow on purpose -- the guard
        # is here for datasets and checkpoints, and this does not loosen it for those.
        exclude: ^assets/.*\.gif$

  # Pinned to the same ruff `uv.lock` gives CI. They drifted once -- v0.13.0 here against
  # 0.16.2 there -- and the gap was not cosmetic: ruff learnt to format Python code blocks
  # inside Markdown somewhere between the two, so a commit passed this hook and failed
  # `ruff format --check .` in CI, on a file the author had no reason to think ruff read.
  # A local gate that is more permissive than the remote one is worse than no local gate,
  # because it teaches people the remote one is flaky. tests/test_hook_versions.py checks
  # they still agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.22
    hooks:
      - id: uv-lock          # keep uv.lock in sync with pyproject.toml

  # Commit messages follow Conventional Commits. This runs at the commit-msg
  # stage rather than pre-commit, so it needs its own install:
  #   pre-commit install --hook-type commit-msg
  # See CONTRIBUTING.md for the allowed types and why the history was rewritten.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
